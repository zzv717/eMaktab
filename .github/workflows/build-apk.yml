# 📱 Android APK (TWA) — eMaktab ilovasi
# Ishga tushirish: Actions → "Build Android APK" → Run workflow
# (yoki twa-manifest.json / android/ o'zgarsa — avtomatik)
# Natija: GitHub Release "app-latest" → eMaktab.apk
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", "twa-manifest.json", ".github/workflows/build-apk.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 🔐 Keystore (bazadan olish yoki birinchi marta yaratish)
        env:
          SITE: https://e-maktab-azizbek-9ad4.vercel.app
        run: |
          RESP=$(curl -sf --retry 3 --retry-delay 5 "$SITE/api/admin/signing-key?secret=emaktab123" || echo '{"ok":false}')
          if echo "$RESP" | grep -q '"ok":true'; then
            echo "$RESP" | jq -r '.b64' | base64 -d > emaktab-release.p12
            echo "$RESP" | jq -r '.password' > ks-pass.txt
            echo "Keystore bazadan olindi."
          else
            PASS=$(openssl rand -hex 12)
            keytool -genkeypair -keystore emaktab-release.p12 -storetype PKCS12 \
              -alias emaktab -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=eMaktab Android, O=eMaktab, C=UZ"
            echo "$PASS" > ks-pass.txt
            FP=$(keytool -exportcert -rfc -keystore emaktab-release.p12 -storepass "$PASS" -alias emaktab 2>/dev/null \
              | openssl x509 -fingerprint -sha256 -noout | cut -d= -f2 | tr -d ':' | tr 'a-f' 'A-F')
            curl -sf -X POST "$SITE/api/admin/signing-key?secret=emaktab123" \
              -H "Content-Type: application/json" \
              -d "{\"b64\":\"$(base64 -w0 emaktab-release.p12)\",\"password\":\"$PASS\",\"fingerprint\":\"$FP\"}" > /dev/null \
              && echo "Yangi keystore bazaga saqlandi." \
              || echo "⚠️ Keystore bazaga saqlanmadi (keyingi safar saqlanadi)."
            # Bazada eski kalit bo'lsa — uni qayta ishlatamiz (imzo barqaror bo'lsin)
            RESP2=$(curl -sf "$SITE/api/admin/signing-key?secret=emaktab123" || echo '{"ok":false}')
            if echo "$RESP2" | grep -q '"ok":true'; then
              echo "$RESP2" | jq -r '.b64' | base64 -d > emaktab-release.p12
              echo "$RESP2" | jq -r '.password' > ks-pass.txt
              echo "(bazadagi kalit ishlatildi)"
            fi
          fi

      - name: 🤖 APK yaratish (gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: ✍️ APK imzolash (apksigner)
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          echo "build-tools: $BT"
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign \
            --ks emaktab-release.p12 --ks-key-alias emaktab \
            --ks-pass "pass:$(cat ks-pass.txt)" --key-pass "pass:$(cat ks-pass.txt)" \
            --out eMaktab.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify eMaktab.apk
          ls -la eMaktab.apk

      - name: 🔍 Xato bo'lsa — log yuborish
        if: failure()
        env:
          SITE: https://e-maktab-azizbek-9ad4.vercel.app
        run: |
          LOG=$( (cd android && ./gradlew assembleRelease --no-daemon 2>&1 | tail -120) || true)
          curl -sf -X POST "$SITE/api/admin/build-log?secret=emaktab123" \
            -H "Content-Type: application/json" \
            -d "$(jq -Rs '{log: .}' <<< "$LOG")" > /dev/null || true

      - name: 🚀 Release'ga yuklash
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: "📱 eMaktab ilovasi (APK)"
          body: |
            eMaktab Android ilovasi (TWA — haqiqiy eMaktab ma'lumotlari bilan).
            Faylni telefoningizga yuklab o'rnating: eMaktab.apk
            Yangi versiya chiqsa — shu sahifa yangilanadi.
          files: eMaktab.apk
          fail_on_unmatched_files: true
