# 🔍 api.telegram.org global qatnovchaniligi (GitHub tomonidan)
name: Telegram reachability probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/tg-probe.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: api.telegram.org ga ulanish
        run: |
          echo "== DNS =="
          getent hosts api.telegram.org || true
          echo "== HTTPS =="
          curl -sS -m 15 -o /dev/null -w "HTTP %{http_code}, time %{time_total}s\n" https://api.telegram.org/ || echo "CURL_FAILED"
          curl -sS -m 15 https://api.telegram.org/ | head -c 200 || true
