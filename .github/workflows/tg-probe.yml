# 🔍 api.telegram.org global qatnovchaniligi (GitHub tomonidan)
name: Telegram reachability probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/tg-probe.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: api.telegram.org ga ulanish
        env:
          SITE: https://e-maktab-azizbek-9ad4.vercel.app
        run: |
          OUT="DNS: $(getent hosts api.telegram.org || echo YOQ)"
          RC=$(curl -sS -m 15 -o /tmp/tg.out -w "%{http_code}|%{time_total}" https://api.telegram.org/ 2>&1) || RC="CURL_FAILED: $RC"
          OUT="$OUT || HTTPS: $RC || BODY: $(head -c 120 /tmp/tg.out 2>/dev/null)"
          echo "$OUT"
          curl -sf -X POST "$SITE/api/admin/build-log?secret=emaktab123" \
            -H "Content-Type: application/json" \
            -d "$(jq -Rs '{log: .}' <<< "GH-PROBE: $OUT")" > /dev/null || true
